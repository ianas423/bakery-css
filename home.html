<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweet Bakery</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#FFF8F2;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:#fff;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.logo{
    font-size:30px;
    font-weight:700;
    color:#8B4513;
}

nav a{
    text-decoration:none;
    margin-left:25px;
    color:#444;
    font-weight:500;
    transition:.3s;
}

nav a:hover{
    color:#D2691E;
}

.hero{
    display:flex;
    justify-content:space-between;
    align-items:center;
    min-height:85vh;
    padding:50px 8%;
    gap:50px;
    flex-wrap:wrap;
}

.text{
    flex:1;
}

.text h1{
    font-size:58px;
    color:#5C2C06;
    line-height:1.2;
}

.text span{
    color:#D2691E;
}

.text p{
    margin:25px 0;
    color:#666;
    font-size:18px;
    line-height:1.7;
}

.btn{
    display:inline-block;
    text-decoration:none;
    background:#D2691E;
    color:white;
    padding:15px 35px;
    border-radius:50px;
    margin-right:15px;
    transition:.3s;
}

.btn:hover{
    background:#8B4513;
}

.btn2{
    display:inline-block;
    text-decoration:none;
    border:2px solid #D2691E;
    color:#D2691E;
    padding:15px 35px;
    border-radius:50px;
    transition:.3s;
}

.btn2:hover{
    background:#D2691E;
    color:white;
}

.image{
    flex:1;
    text-align:center;
}

.image img{
    width:100%;
    max-width:500px;
    border-radius:25px;
    box-shadow:0 20px 40px rgba(0,0,0,.15);
}

@media(max-width:768px){

header{
    flex-direction:column;
    gap:15px;
}

nav a{
    margin:0 10px;
}

.hero{
    flex-direction:column-reverse;
    text-align:center;
}

.text h1{
    font-size:40px;
}

.image img{
    max-width:350px;
}

}

</style>

</head>
<body>

<header>

<div class="logo">🍰 Sweet Bakery</div>

<nav>
<a href="home.html">Home</a>
<a href="memu.html">Menu</a>
<a href="about.html">About</a>
<a href="contect.html">Contact</a>
</nav>

</header>

<section class="hero">

<div class="text">

<h1>Freshly Baked <span>Every Day</span></h1>

<p>
Welcome to Sweet Bakery! We bake delicious cakes, pastries, cookies,
and fresh bread every day using premium ingredients and lots of love.
Taste happiness in every bite.
</p>

<a href="order.html" class="btn">Order Now</a>
<a href="#" class="btn2">View Menu</a>

</div>

<div class="image">

<img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=800" alt="Bakery">

</div>

</section>

</body>
</html>
