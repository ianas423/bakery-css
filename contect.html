<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweet Bakery | Contact Us</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#fff8f2;
}

.contact{
    width:90%;
    max-width:1200px;
    margin:60px auto;
}

.title{
    text-align:center;
    margin-bottom:50px;
}

.title h1{
    font-size:45px;
    color:#8B4513;
}

.title p{
    color:#666;
    margin-top:10px;
}

.container{
    display:flex;
    justify-content:space-between;
    gap:40px;
    flex-wrap:wrap;
}

.info{
    flex:1;
    min-width:320px;
}

.info h2{
    color:#8B4513;
    margin-bottom:20px;
}

.box{
    background:#fff;
    padding:18px;
    margin-bottom:18px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.box h3{
    color:#D2691E;
    margin-bottom:8px;
}

.box p{
    color:#666;
}

.form{
    flex:1;
    min-width:320px;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.form input,
.form textarea{
    width:100%;
    padding:15px;
    margin-bottom:18px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

.form input:focus,
.form textarea:focus{
    border-color:#D2691E;
}

.form textarea{
    height:150px;
    resize:none;
}

button{
    width:100%;
    padding:15px;
    background:#8B4513;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#D2691E;
}

.map{
    margin-top:50px;
}

.map iframe{
    width:100%;
    height:350px;
    border:none;
    border-radius:15px;
}

@media(max-width:768px){

.title h1{
    font-size:35px;
}

.container{
    flex-direction:column;
}

}
</style>

</head>
<body>

<section class="contact">

<div class="title">
<h1>📞 Contact Us</h1>
<p>We'd love to hear from you. Get in touch today!</p>
</div>

<div class="container">

<div class="info">

<h2>Contact Information</h2>

<div class="box">
<h3>📍 Address</h3>
<p>University Road, Peshawar, Pakistan</p>
</div>

<div class="box">
<h3>📞 Phone</h3>
<p>+923295250052</p>
</div>

<div class="box">
<h3>📧 Email</h3>
<p>sweetbakery@gmail.com</p>
</div>

<div class="box">
<h3>🕒 Opening Hours</h3>
<p>Monday - Sunday<br>8:00 AM - 10:00 PM</p>
</div>

</div>

<div class="form">

<input type="text" placeholder="Your Name">

<input type="email" placeholder="Your Email">

<input type="text" placeholder="Subject">

<textarea placeholder="Write Your Message..."></textarea>

<button>Send Message</button>

</div>

</div>

<div class="map">

<iframe
src="https://www.google.com/maps?q=Peshawar&output=embed">
</iframe>

</div>

</section>

</body>
</html>
